<mat-form-field id="reportSelect" appearance="outline" subscriptSizing="dynamic">
  <mat-label>Report</mat-label>
  <mat-select [value]="selectedTab()?.path" (selectionChange)="router.navigateByUrl($event.value)">
    @for (tab of tabs; track tab.path) {
      <mat-option [value]="tab.path">{{tab.name}}</mat-option>
    }
  </mat-select>
</mat-form-field>
<mat-divider></mat-divider>
<router-outlet></router-outlet>
