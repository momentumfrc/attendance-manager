@if (mayModify | async) {
  <div id="actions">
    <button mat-stroked-button color="warn" (click)="startNewSeason()">Start New Season</button>
    <button mat-raised-button color="primary" [disabled]="updatingCanvas" (click)="updateCanvas()">Update Slack Canvas</button>
  </div>
}

<div id="searchbar">
  <app-search-box (searchUpdatedEvent)="studentSearch.next($event)"></app-search-box>
</div>

@if (view | async; as view) {
  <div id="tableContainer">
    <table mat-table [dataSource]="view.rows" [trackBy]="trackByStudent" id="registrationTable">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Student</th>
        <td mat-cell *matCellDef="let row">{{row.name}}</td>
      </ng-container>
      @for (column of steps; track column.step) {
        <ng-container [matColumnDef]="column.step">
          <th mat-header-cell *matHeaderCellDef class="centered">{{column.label}}</th>
          <td mat-cell *matCellDef="let row" class="centered">
            <mat-checkbox
              [checked]="isCompleted(row.student, column.step)"
              [disabled]="!view.modifiableSteps.includes(column.step) || view.pending.includes(pendingKey(row.student, column.step))"
              (change)="toggleStep(row.student, column.step, $event)"
              [attr.aria-label]="column.label + ' for ' + row.name">
            </mat-checkbox>
          </td>
        </ng-container>
      }
      <tr mat-header-row *matHeaderRowDef="columns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: columns;"></tr>
    </table>
    @if (view.rows.length == 0) {
      <div id="noStudentsWarn">No matching students found!</div>
    }
  </div>
} @else {
  <app-spinner></app-spinner>
}
